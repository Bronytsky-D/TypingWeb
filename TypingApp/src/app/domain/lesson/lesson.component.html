  <div class="lesson-description" *ngIf="lesson?.description">
    {{ this.description }}
  </div>
  
<app-typing-core [lettersContainer]="this.lettersContainer" [timerEnd]="this.isGameEnded" (toggle)="switchTimer($event)" (endGame)="gameOver($event)">

  <div class="keyboard-wrapper">
    <div class="keyboard">
      <div class="row" *ngFor="let row of keyboardLayout">
        <div class="key" 
             *ngFor="let key of row" 
             [id]="key.id" 
             [ngClass]="getKeyClasses(key)">
          {{ key.display }}
          <div class="finger-indicator" *ngIf="isExpectedKey(key)"></div>
        </div>
      </div>
    </div>
  </div>
